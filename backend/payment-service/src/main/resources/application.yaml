server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payflow_payment}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  task:
    scheduling:
      pool:
        size: 2
payment:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:24h}
  outbox:
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:1000}

payflow:
  internal:
    # Shared secret for calling auth-service to resolve a handle to its owner.
    # Must match auth-service. Blank means no transfer can be initiated at all,
    # because an unresolvable handle must never fall through to a guess.
    api-token: ${INTERNAL_API_TOKEN:}

spring.cloud.openfeign:
  client:
    config:
      default:
        # The handle lookup is on the critical path of every transfer, so it is
        # bounded tightly. It is a single small read inside the compose network.
        connectTimeout: 1000
        readTimeout: 1500

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    kafka:
      enabled: true

logging:
  structured:
    format:
      # One JSON object per line, which is what Filebeat and the Elastic agent
      # ingest without needing a grok pattern. Console stays human readable in
      # development by overriding this to console in a local profile.
      file: ecs
